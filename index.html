<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gemini Chat Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-dot" aria-hidden="true"></span>
        <h1>Gemini Chat</h1>
      </div>
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle dark and light theme">
        <span class="theme-icon" aria-hidden="true">🌙</span>
        <span class="theme-label">Dark</span>
      </button>
    </header>

    <main class="chat-panel" aria-live="polite">
      <section id="messageList" class="message-list" aria-label="Conversation messages"></section>
    </main>

    <form id="chatForm" class="composer" autocomplete="off">
      <label for="messageInput" class="sr-only">Type a message</label>
      <textarea id="messageInput" class="composer-input" rows="1" placeholder="Ask anything..." required></textarea>
      <button id="sendButton" class="send-button" type="submit">Send</button>
    </form>
  </div>

  <template id="messageTemplate">
    <article class="message-row">
      <div class="avatar"></div>
      <div class="bubble-wrap">
        <div class="meta"></div>
        <div class="bubble"></div>
      </div>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
